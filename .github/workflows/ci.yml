name: CI

# Swiit on its own, where it is meant to run: macOS and Linux.

# The jobs on macOS (lint, format, the macOS tests, the macOS bridges, the docs) run only when the
# repository variable MACOS_RUNNERS is 'true': they are off for now, as the hosted macOS runners
# are scarce, and the same checks are run locally. Linux runs always.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What the compiler lets through: unchecked concurrency without a stated
  # reason, forced casts, `try!`, and code too tangled to follow. There is no
  # baseline: a finding is fixed, or its rule is disabled on that line with the reason.
  lint:
    name: Lint
    if: ${{ vars.MACOS_RUNNERS == 'true' }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint lint --strict Sources

  # The code is as `swift format` writes it (.swift-format): formatting it again changes nothing.
  format:
    name: Format
    if: ${{ vars.MACOS_RUNNERS == 'true' }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: swift format
        run: |
          swift format -i -r Sources Tests
          git diff --exit-code

  macos:
    name: macOS
    if: ${{ vars.MACOS_RUNNERS == 'true' }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The bridges in Sources/Swiit/SwiftLibraryBridges/Generated are read from this
      # Swift's symbol graphs, so the newest Xcode is the one they match.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/cache@v4
        with:
          path: |
            .build
          key: macos-${{ runner.arch }}-swift-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: macos-${{ runner.arch }}-swift-

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test

  linux:
    name: Linux
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            .build
          key: linux-${{ runner.arch }}-swift-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: linux-${{ runner.arch }}-swift-

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test

  # The bridges (Sources/Swiit/SwiftLibraryBridges/Generated) are made from symbol graphs,
  # and a graph is read on the platform it's made on. Each platform's members
  # are kept in Bridges/<platform>, and only what all of them have is bridged,
  # so a member one platform lacks can't break the build on another.
  bridges-macos:
    name: Bridges (macOS)
    if: ${{ vars.MACOS_RUNNERS == 'true' }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Generating again must change nothing: otherwise the generator, the
      # toolchain or a manifest changed and the bridges weren't remade.
      - name: Bridges are current
        run: |
          Scripts/bridge
          changes=$(git status --porcelain -- Sources Bridges)
          if [ -n "$changes" ]; then
            git status --short -- Sources Bridges
            git diff --stat -- Sources Bridges
            git diff -- Sources Bridges | head -150
            echo "::error::The bridges are out of date: run Scripts/bridge and commit the result."
            exit 1
          fi

      # The bridges are read from the SDK this job has, which may be older than the one a developer
      # runs: what it made is here to commit.
      - name: Keep the bridges this job made
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bridges-macos
          path: |
            Sources/Swiit/SwiftLibraryBridges/Generated
            Bridges

  bridges-linux:
    name: Bridges (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # What this platform has, for whoever commits it (`gh run download`).
      - name: Make Linux's manifests
        run: Scripts/bridge

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridges-linux
          path: Bridges/linux

      - name: Manifests are current
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          changes=$(git status --porcelain -- Bridges/linux)
          if [ -n "$changes" ]; then
            git status --short -- Bridges/linux
            git diff --stat -- Bridges/linux
            echo "::error::Linux's bridge manifests changed: download the bridges-linux artifact into the repository root, run Scripts/bridge on macOS, and commit."
            exit 1
          fi
