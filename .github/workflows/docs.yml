name: Docs

# The DocC documentation (Sources/Swiit/Swiit.docc and the doc comments), built for every change and
# published from main on GitHub Pages: https://raklaptudirm.github.io/Swiit/

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# DocC comes with the Swift toolchain, so this runs on Linux: SwiftPM writes the symbol graphs and
# `docc convert` builds the catalog with them, as Xcode's docbuild does.
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Only the library's graphs: the generator and the benchmarks are not documented.
      - name: Write the symbol graphs
        run: |
          set -o pipefail
          swift package dump-symbol-graph --minimum-access-level public | tee graphs.log
          directory=$(sed -n 's/^Files written to //p' graphs.log | tail -1)
          mkdir graphs
          cp "$directory"/Swiit.symbols.json "$directory"/Swiit@*.symbols.json graphs/

      # A link the catalog can't resolve, or one that names an overload ambiguously, fails the
      # build, as it would show readers a broken reference.
      - name: Build the documentation
        run: |
          set -o pipefail
          # Served from https://raklaptudirm.github.io/Swiit/, so every link starts with /Swiit/.
          docc convert Sources/Swiit/Swiit.docc \
            --fallback-display-name Swiit --fallback-bundle-identifier Swiit \
            --additional-symbol-graph-dir graphs \
            --transform-for-static-hosting --hosting-base-path Swiit \
            --output-path site 2>&1 | tee docbuild.log
          if grep -E "Swiit\.docc.*(warning|error)" docbuild.log; then exit 1; fi

      # The site's root has no page of its own, so it goes to the module's.
      - name: Add the root page
        run: |
          cat > site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>Swiit</title>
          <meta http-equiv="refresh" content="0; url=documentation/swiit/">
          <link rel="canonical" href="documentation/swiit/">
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy
    # Only main is published; a pull request's build only checks the documentation.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}documentation/swiit/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
